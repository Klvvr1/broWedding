<title>زواج عبدالله وابتسام</title>

<style>
  :root{
    --paper:#ecece9; --paper-hi:#f6f6f4; --ink:#5f5f5b; --ink-soft:#8b8b86; --line:#c9c9c4;
    --shadow:rgba(80,80,70,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--paper)}
  body{
    font-family:"Tajawal",system-ui,sans-serif; color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  .card{max-width:520px;margin:0 auto;overflow:hidden;background:var(--paper)}
  img{display:block;width:100%;height:auto}
  .fade-b{-webkit-mask-image:linear-gradient(#000 95%,transparent);mask-image:linear-gradient(#000 95%,transparent)}
  .fade-t{-webkit-mask-image:linear-gradient(transparent,#000 6%);mask-image:linear-gradient(transparent,#000 6%)}
  .fade-x{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .sec{padding:0 16px}
  .names{margin-top:-4px}

  /* embossed text, like the card */
  .emb{color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.85),0 -1px 1px rgba(0,0,0,.12)}

  /* personal badge */
  .badge{position:relative;margin:24px auto 4px;width:min(210px,60%);padding:15px 12px 13px;text-align:center}
  .badge i{position:absolute;width:18px;height:18px;border-color:var(--ink-soft);border-style:solid}
  .badge i:nth-child(1){top:0;right:0;border-width:2px 2px 0 0}
  .badge i:nth-child(2){top:0;left:0;border-width:2px 0 0 2px}
  .badge i:nth-child(3){bottom:0;right:0;border-width:0 2px 2px 0}
  .badge i:nth-child(4){bottom:0;left:0;border-width:0 0 2px 2px}
  .badge .k{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--ink-soft)}
  .badge .one{font-size:12px;font-weight:500;margin-top:2px}
  .badge .lbl{font-size:10px;color:var(--ink-soft);margin-top:8px}
  .badge .num{font-size:39px;font-weight:300;line-height:1.05;letter-spacing:1px}
  .badge.hidden{display:none}

  .divider{width:56%;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--line),transparent)}

  /* date */
  .date{text-align:center}
  .date .day{font-size:20px;font-weight:500}
  .date .greg{font-size:30px;font-weight:300;letter-spacing:1px;margin-top:2px}
  .date .hij{font-size:15px;color:var(--ink-soft)}
  .date .time{font-size:20px;font-weight:500;margin-top:8px}

  /* countdown */
  .cd-title{text-align:center;font-size:14px;color:var(--ink-soft);margin:20px 0 10px}
  .cd{display:flex;justify-content:center;gap:10px;direction:rtl}
  .cd div{width:68px;padding:10px 0 8px;text-align:center;border-radius:10px;background:var(--paper-hi);
          box-shadow:inset 0 1px 0 #fff,0 2px 6px var(--shadow)}
  .cd b{display:block;font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
  .cd span{font-size:12px;color:var(--ink-soft)}
  .cd-msg{text-align:center;font-size:20px;font-weight:500;margin-top:6px;display:none}

  /* venue */
  .venue{text-align:center}
  .pin{width:26px;height:26px;margin:0 auto 6px;color:var(--ink-soft)}
  .venue .name{font-size:22px;font-weight:500}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:11px 22px;border-radius:999px;
       color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;background:var(--paper-hi);
       box-shadow:inset 0 1px 0 #fff,0 2px 8px var(--shadow);border:1px solid var(--line)}
  .btn:active{transform:translateY(1px)}

  /* notes */
  .notes{display:flex;justify-content:center;align-items:flex-start;gap:6px;margin-top:4px}
  .note{flex:1;max-width:180px;text-align:center;font-size:17px;font-weight:500;line-height:1.5}
  .note svg{width:46px;height:46px;margin:0 auto 8px;display:block;color:var(--ink-soft)}
  .notes .sep{width:1px;align-self:stretch;margin:14px 0;background:var(--line)}

  .tail{margin-top:10px}
  .fade-b{margin-bottom:-6px}
  .foot{text-align:center;font-size:12px;color:var(--ink-soft);padding:6px 0 0}
</style>
</head>

<script>
(function(){
  // invitation number from ?n=
  try{
    var n=parseInt(new URLSearchParams(location.search).get('n'),10);
    if(n>=1 && n<=200){
      var num=document.getElementById('num'); num.textContent=n; num.hidden=false;
      document.getElementById('lbl').hidden=false;
      document.title='دعوة رقم '+n+' — زواج عبدالله وابتسام';
    }
  }catch(e){}
  // countdown to the wedding day (Riyadh time, UTC+3)
  var target=new Date('2026-10-24T20:00:00+03:00').getTime();
  var end=new Date('2026-10-25T03:00:00+03:00').getTime();
  var el={d:document.getElementById('d'),h:document.getElementById('h'),m:document.getElementById('m'),s:document.getElementById('s')};
  function tick(){
    var now=Date.now(), t=target-now;
    if(t<=0){
      document.getElementById('cd').style.display='none';
      document.getElementById('cdTitle').style.display='none';
      var msg=document.getElementById('cdMsg'); msg.style.display='block';
      msg.textContent = now<end ? 'الحفل قائم الآن — أهلاً وسهلاً بكم' : 'شكراً لحضوركم ومشاركتكم فرحتنا';
      return;
    }
    var s=Math.floor(t/1000);
    el.d.textContent=Math.floor(s/86400);
    el.h.textContent=Math.floor(s%86400/3600);
    el.m.textContent=Math.floor(s%3600/60);
    el.s.textContent=s%60;
    setTimeout(tick,1000-(now%1000));
  }
  tick();
})();
</script>
