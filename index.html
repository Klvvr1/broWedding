<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>زواج عبدالله وابتسام</title>
<meta name="description" content="دعوة زواج عبدالله وابتسام — السبت 24 أكتوبر 2026، قصر بصمات للاحتفالات">
<meta name="theme-color" content="#ecece9">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<meta property="og:title" content="دعوة زواج عبدالله وابتسام">
<meta property="og:description" content="السبت 24/10/2026 — قصر بصمات للاحتفالات">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preload" as="image" href="page.jpg">
<link rel="preload" as="font" type="font/woff2" href="fonts/Tajawal-Medium.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/Tajawal-Light.woff2" crossorigin>
<style>
  @font-face{font-family:'Tajawal';font-weight:300;font-style:normal;font-display:block;src:url('fonts/Tajawal-Light.woff2') format('woff2')}
  @font-face{font-family:'Tajawal';font-weight:400;font-style:normal;font-display:block;src:url('fonts/Tajawal-Regular.woff2') format('woff2')}
  @font-face{font-family:'Tajawal';font-weight:500;font-style:normal;font-display:block;src:url('fonts/Tajawal-Medium.woff2') format('woff2')}
  :root{color-scheme:only light}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#ecece9;color-scheme:only light;forced-color-adjust:none}
  .wrap{position:relative;max-width:520px;margin:0 auto}
  .wrap>img{display:block;width:100%;height:auto}
  .ov{position:absolute}
  canvas.ov{pointer-events:none}
  a.ov{display:block;border-radius:999px;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main class="wrap" id="wrap">
  <img src="page.jpg" width="1170" height="4031" alt="دعوة زواج: تتشرف أم عبدالله وأم بسام بدعوتكم لحضور زواج ابننا عبدالله وابنتنا ابتسام، وذلك بمشيئة الله يوم السبت 24/10/2026 الموافق 13 جمادى الأولى 1448 هـ، في قصر بصمات للاحتفالات. دعوة شخصية صالحة لشخص واحد فقط. ممنوع اصطحاب الأطفال، ويمنع جوالات الكاميرا. وبحضوركم يتم لنا الفرح والسرور.">
  <canvas class="ov" id="cdc" style="left:0.0000%;top:41.7362%;width:100.0000%;height:7.7835%"></canvas>
  <canvas class="ov" id="numc" style="left:26.1538%;top:69.5825%;width:47.6923%;height:4.2377%"></canvas>
  <a class="ov" style="left:20.5769%;top:59.6255%;width:58.8421%;height:3.5725%" href="https://maps.app.goo.gl/WJASRuugTascabQo8" target="_blank" rel="noopener" aria-label="افتح موقع قصر بصمات على الخريطة"></a>
  <p class="sr" id="sr" aria-live="polite"></p>
</main>
<script>
(function(){
  var INK='#5f5f5b', SOFT='#8b8b86', PAPER='#ecece9', BASE=390;
  var DIG={"d": [0.7128205128205128, 0.4053488719557747, 0.17435897435897435, 0.27341999103541015], "h": [0.5128205128205128, 0.4053488719557747, 0.17435897435897435, 0.27341999103541015], "m": [0.3128205128205128, 0.4053488719557747, 0.17435897435897435, 0.27341999103541015], "s": [0.11282051282051282, 0.4053488719557747, 0.17435897435897435, 0.27341999103541015]};
  var n=null;
  try{ var v=parseInt(new URLSearchParams(location.search).get('n'),10); if(v>=1&&v<=250) n=v; }catch(e){}
  if(n) document.title='دعوة رقم '+n+' — زواج عبدالله وابتسام';
  var target=new Date('2026-10-24T20:00:00+03:00').getTime(), end=new Date('2026-10-25T03:00:00+03:00').getTime();
  function prep(c){var r=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
    if(c.width!==Math.round(w*r)||c.height!==Math.round(h*r)){c.width=Math.round(w*r);c.height=Math.round(h*r);}
    var x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);return [x,w,h];}
  function emb(x,t,X,Y,col){x.fillStyle='rgba(255,255,255,.85)';x.fillText(t,X,Y+1);x.fillStyle=col;x.fillText(t,X,Y);}
  function scale(){return document.getElementById('wrap').clientWidth/BASE;}
  function drawNum(){
    var c=document.getElementById('numc'),a=prep(c),x=a[0],w=a[1],h=a[2],s=scale();
    if(!n) return;
    x.textAlign='center';x.textBaseline='middle';x.direction='rtl';
    x.font='400 '+(10*s)+'px Tajawal, sans-serif'; emb(x,'رقم الدعوة',w/2,8*s,SOFT);
    x.font='300 '+(39*s)+'px Tajawal, sans-serif'; emb(x,String(n),w/2,16*s+(h-16*s)/2+2*s,INK);
    document.getElementById('sr').textContent='رقم الدعوة '+n;
  }
  function drawCd(){
    var c=document.getElementById('cdc'),a=prep(c),x=a[0],w=a[1],h=a[2],s=scale(),now=Date.now(),t=target-now;
    x.textAlign='center';x.textBaseline='middle';
    if(t<=0){
      x.fillStyle=PAPER;x.fillRect(0,0,w,h);
      x.font='500 '+(20*s)+'px Tajawal, sans-serif';x.direction='rtl';
      emb(x, now<end?'الحفل قائم الآن — أهلاً وسهلاً بكم':'شكراً لحضوركم ومشاركتكم فرحتنا', w/2,h/2,INK);
      return false;
    }
    var S=Math.floor(t/1000), v={d:Math.floor(S/86400),h:Math.floor(S%86400/3600),m:Math.floor(S%3600/60),s:S%60};
    x.font='500 '+(26*s)+'px Tajawal, sans-serif';x.direction='ltr';
    for(var k in DIG){var r=DIG[k]; emb(x,String(v[k]),(r[0]+r[2]/2)*w,(r[1]+r[3]/2)*h+1*s,INK);}
    return true;
  }
  function loop(){ if(drawCd()) setTimeout(loop,1000-(Date.now()%1000)); }
  function all(){drawNum();drawCd();}
  var go=function(){all();loop();};
  (document.fonts&&document.fonts.load? Promise.all([document.fonts.load('500 26px Tajawal'),document.fonts.load('300 39px Tajawal'),document.fonts.load('400 10px Tajawal')]).catch(function(){}) : Promise.resolve()).then(go);
  window.addEventListener('resize',all);
})();
</script>
</body>
</html>
